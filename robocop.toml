# Padrao do Robocop nesta automacao: robocop check (lint) e robocop format.
# Os limites padrao miram testes curtos; aqui os testes sao E2E de interface.

[tool.robocop]
cache = false

[tool.robocop.lint]
configure = [
    # Localizador fica inteiro numa linha para poder ser colado no DevTools.
    "line-too-long.line_length=150",
    "line-too-long.ignore_pattern=^\\$\\{\\w+\\}\\s+(xpath|css)=|^\\s*\\.\\.\\.\\s+\\(//",
    "too-long-test-case.max_len=40",
    "too-long-test-case.ignore_docs=True",
    "too-many-calls-in-test-case.max_calls=25",
    "too-long-keyword.max_len=50",
    "too-long-keyword.ignore_docs=True",
    "too-many-calls-in-keyword.max_calls=20",
]
# O nome do cenario ja e a especificacao, escrito como frase completa:
# documentacao obrigatoria fica so nas keywords.
ignore = ["DOC02"]

[tool.robocop.format]
configure = ["SplitTooLongLine.line_length=150"]
