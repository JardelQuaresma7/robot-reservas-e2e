<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="api-key" content="{{ api_key }}">
<title>{% block title %}Locadora Demo{% endblock %}</title>
<style>
  :root { --brand:#0b5cad; --bg:#f4f6f9; --line:#d7dde5; --danger:#b42318; --ok:#067647; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Segoe UI, Arial, sans-serif; background:var(--bg); color:#1d2939; }
  header { background:var(--brand); color:#fff; padding:12px 24px; display:flex; gap:24px; align-items:center; }
  header a { color:#fff; text-decoration:none; font-weight:600; }
  header .logo { font-size:18px; margin-right:auto; }
  main { padding:24px; max-width:1200px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 16px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:12px; }
  .step.locked { opacity:.45; pointer-events:none; }
  .step h2 { font-size:16px; margin:0 0 12px; }
  label { display:block; font-size:13px; margin:8px 0 4px; }
  input, select { padding:7px 9px; border:1px solid var(--line); border-radius:6px; font-size:14px; min-width:220px; }
  input[type=checkbox], input[type=radio] { min-width:0; }
  button, .btn { background:var(--brand); color:#fff; border:0; border-radius:6px; padding:8px 14px; cursor:pointer; font-size:14px; text-decoration:none; display:inline-block; }
  button.secondary, .btn.secondary { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  button:disabled { background:#98a2b3; cursor:not-allowed; }
  .error { color:var(--danger); font-size:13px; min-height:16px; }
  .row { display:flex; gap:16px; flex-wrap:wrap; align-items:flex-end; }
  .layout { display:grid; grid-template-columns: 1fr 320px; gap:16px; align-items:start; }
  .summary { position:sticky; top:16px; }
  .summary dl { display:grid; grid-template-columns:1fr auto; gap:6px 12px; margin:0; font-size:14px; }
  .summary dt { color:#475467; } .summary dd { margin:0; text-align:right; }
  .groups { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  .group-card { border:1px solid var(--line); border-radius:8px; padding:10px; }
  .group-card.sold-out { border-color:var(--danger); }
  .badge { font-size:12px; padding:2px 8px; border-radius:10px; background:#eef4ff; }
  .badge.danger { background:#fee4e2; color:var(--danger); }
  table { width:100%; border-collapse:collapse; background:#fff; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); font-size:14px; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; }
  .modal-backdrop.open { display:flex; }
  .modal { background:#fff; border-radius:8px; padding:20px; width:420px; }
  .modal h3 { margin-top:0; }
  .toast { position:fixed; right:24px; bottom:24px; background:var(--ok); color:#fff; padding:12px 16px; border-radius:6px; display:none; }
  .toast.show { display:block; }
  .alert { padding:10px 12px; border-radius:6px; background:#ecfdf3; color:var(--ok); margin-bottom:12px; }
</style>
</head>
<body>
<header>
  <a class="logo" href="/">Locadora Demo</a>
  <a href="/reservas/nova-pf" id="nav-nova-pf">Reserva PF</a>
  <a href="/reservas/nova-pj" id="nav-nova-pj">Reserva PJ</a>
  <a href="/reservas" id="nav-consulta">Consultar reserva</a>
  <a href="/clientes/novo" id="nav-cliente">Cadastrar cliente</a>
</header>
<main>{% block content %}{% endblock %}</main>
<div class="toast" id="toast" role="status"></div>
<script>
  const API_KEY = document.querySelector('meta[name=api-key]').content;
  async function api(method, path, body) {
    const res = await fetch(path, {
      method, headers: {'X-Api-Key': API_KEY, 'Content-Type': 'application/json'},
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    return {ok: res.ok, status: res.status, data};
  }
  function toast(text) {
    const t = document.getElementById('toast');
    t.textContent = text; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }
  function openModal(id) { document.getElementById(id).classList.add('open'); }
  function closeModal(id) { document.getElementById(id).classList.remove('open'); }
  const money = v => 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
</script>
{% block scripts %}{% endblock %}
</body>
</html>
